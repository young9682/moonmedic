# E03: LimitRange max memory 64Mi,Deployment 容器要 256Mi —— 准入拒绝(与配额无关)
apiVersion: v1
kind: Namespace
metadata:
  name: moonmedic-eval-e03
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mem-max-64mi
  namespace: moonmedic-eval-e03
spec:
  limits:
    - type: Container
      max:
        memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: moonmedic-eval-e03
  labels:
    app: moonmedic-eval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          resources:
            limits:
              memory: 256Mi
