# E01: ResourceQuota hard pods=0 —— Deployment 一个 Pod 都创建不出来
apiVersion: v1
kind: Namespace
metadata:
  name: moonmedic-eval-e01
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zero-pods
  namespace: moonmedic-eval-e01
spec:
  hard:
    pods: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: moonmedic-eval-e01
  labels:
    app: moonmedic-eval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
