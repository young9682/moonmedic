# E02: ResourceQuota hard pods=1,期望副本 2 —— 部分副本创建成功,其余 FailedCreate
apiVersion: v1
kind: Namespace
metadata:
  name: moonmedic-eval-e02
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: one-pod
  namespace: moonmedic-eval-e02
spec:
  hard:
    pods: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: moonmedic-eval-e02
  labels:
    app: moonmedic-eval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
