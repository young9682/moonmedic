name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon update (refresh registry index)
        run: moon update
      - name: moon fmt --check
        run: moon fmt --check
      - name: moon check
        run: moon check
      - name: core dependency boundary
        run: |
          if grep -R -n -E "kubemoon|moonmedic/llm" --include='moon.pkg' core rules snapshot; then
            echo "core/rules/snapshot must stay transport- and LLM-independent"
            exit 1
          fi
      - name: moon test
        run: moon test
      - name: Replay diagnostic fixtures
        run: bash eval/scripts/run-all.sh
      - name: Reject incomplete rollout evidence
        run: python eval/scripts/check-rollout-inputs.py
      - name: Start disposable Kubernetes control plane
        run: kind create cluster --name moonmedic-rollout --image kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f --wait 120s
      - name: Observe blocked rollout and recovery
        timeout-minutes: 12
        run: bash eval/scripts/rollout-kind.sh "$RUNNER_TEMP/rollout-evidence"
      - name: Preserve rollout observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-evidence
          path: ${{ runner.temp }}/rollout-evidence
